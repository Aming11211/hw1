<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星際守護者</title>
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at bottom,#14244a,#050817 65%,#02030a);color:#eaf7ff;font-family:system-ui,sans-serif}.game{width:min(94vw,760px)}.heading{display:flex;justify-content:space-between;color:#8eb4d2;padding:0 4px 10px;letter-spacing:.12em}.heading strong{font-size:19px;color:#69f3ff}.stage{position:relative;border:1px solid #3c7193;border-radius:14px;overflow:hidden;box-shadow:0 0 36px #00d9ff2b;touch-action:none}canvas{display:block;width:100%;height:auto;background:#050918}.hud{position:absolute;inset:13px 16px auto;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 7px #000;color:#bceaff}.hud b{color:white;font-size:19px}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#030715c9;text-align:center;padding:20px}.panel h1{margin:0;color:#72f5ff;font-size:clamp(32px,7vw,52px);text-shadow:0 0 20px #00d9ff88}.panel p{line-height:1.8;color:#c1d5e9}.button{border:0;border-radius:30px;padding:13px 30px;background:linear-gradient(100deg,#13c9e8,#706dff);color:#03101c;font-size:16px;font-weight:800;cursor:pointer}.hint{font-size:12px!important;color:#91a9c2!important}.hidden{display:none}.footer{text-align:center;color:#91a9c2;font-size:12px;padding-top:10px}
    </style>
</head>
<body>
    <main class="game">
        <div class="heading"><strong>✦ 星際守護者</strong><span>SPACE SHOOTER</span></div>
        <div class="stage">
            <canvas id="game" width="760" height="520" aria-label="太空射擊遊戲"></canvas>
            <div class="hud"><div>分數　<b id="score">0</b></div><div>生命　<b id="lives">♥ ♥ ♥</b></div></div>
            <div class="overlay" id="overlay"><div class="panel"><h1 id="title">星際守護者</h1><p id="message">駕駛戰機，擊退迎面而來的外星艦隊！<br>收集分數，盡可能生存下去。</p><button class="button" id="start">開始遊戲</button><p class="hint">方向鍵 / WASD 移動・空白鍵射擊<br>手機可拖曳戰機並點擊射擊</p></div></div>
        </div>
        <div class="footer">🔊 音效已啟用　・　保護地球，勇敢出擊！</div>
    </main>
    <script>
        (()=>{
            const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay');
            const scoreText=document.querySelector('#score'),livesText=document.querySelector('#lives'),W=canvas.width,H=canvas.height;
            const stars=Array.from({length:110},()=>({x:Math.random()*W,y:Math.random()*H,size:Math.random()*1.8+.3,speed:Math.random()*1.1+.3})),keys={};
            let audio,player,shots,enemies,particles,score,lives,active=false,last=0,spawn=0;
            function beep(freq,duration,wave='sine',volume=.03){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const osc=audio.createOscillator(),gain=audio.createGain();osc.type=wave;osc.frequency.setValueAtTime(freq,audio.currentTime);osc.frequency.exponentialRampToValueAtTime(Math.max(55,freq*.55),audio.currentTime+duration);gain.gain.setValueAtTime(volume,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration)}catch(_){}}
            function newGame(){player={x:W/2,y:H-58,cooldown:0,invincible:0};shots=[];enemies=[];particles=[];score=0;lives=3;spawn=0;scoreText.textContent=score;showLives();overlay.classList.add('hidden');active=true;last=performance.now();requestAnimationFrame(frame)}
            function showLives(){livesText.textContent='♥ '.repeat(lives).trim()||'—'}
            function burst(x,y,color){for(let i=0;i<12;i++){const a=Math.random()*Math.PI*2,v=1+Math.random()*3;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:32,color})}}
            function ship(x,y){ctx.save();ctx.translate(x,y);ctx.shadowColor='#00dfff';ctx.shadowBlur=16;ctx.fillStyle='#65f6ff';ctx.beginPath();ctx.moveTo(0,-21);ctx.lineTo(16,16);ctx.lineTo(4,11);ctx.lineTo(0,17);ctx.lineTo(-4,11);ctx.lineTo(-16,16);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(5,5);ctx.lineTo(-5,5);ctx.fill();ctx.fillStyle='#ff9a4c';ctx.beginPath();ctx.moveTo(-5,15);ctx.lineTo(0,26+Math.random()*7);ctx.lineTo(5,15);ctx.fill();ctx.restore()}
            function damage(){if(player.invincible>0)return;lives--;player.invincible=65;showLives();burst(player.x,player.y,'#ffad55');beep(120,.28,'sawtooth',.05);if(lives<=0){active=false;document.querySelector('#title').textContent='任務結束';document.querySelector('#message').innerHTML=`最終分數：<b>${score}</b><br>再試一次，創造更高紀錄！`;document.querySelector('#start').textContent='重新開始';overlay.classList.remove('hidden')}}
            function frame(now){if(!active)return;const dt=Math.min((now-last)/16.67,2);last=now;ctx.clearRect(0,0,W,H);
                stars.forEach(s=>{s.y+=s.speed*dt;if(s.y>H){s.y=0;s.x=Math.random()*W}ctx.fillStyle=`rgba(190,220,255,${.25+s.size/3})`;ctx.fillRect(s.x,s.y,s.size,s.size)});
                if(keys.ArrowLeft||keys.a)player.x-=5.2*dt;if(keys.ArrowRight||keys.d)player.x+=5.2*dt;if(keys.ArrowUp||keys.w)player.y-=5.2*dt;if(keys.ArrowDown||keys.s)player.y+=5.2*dt;player.x=Math.max(22,Math.min(W-22,player.x));player.y=Math.max(30,Math.min(H-28,player.y));player.cooldown-=dt;
                if((keys.Space||keys[' '])&&player.cooldown<=0){shots.push({x:player.x,y:player.y-20});player.cooldown=10;beep(740,.06,'triangle',.018)}
                shots.forEach(b=>{b.y-=9*dt;ctx.fillStyle='#8effff';ctx.shadowColor='#40eaff';ctx.shadowBlur=10;ctx.fillRect(b.x-2,b.y-8,4,14);ctx.shadowBlur=0});shots=shots.filter(b=>b.y>-20);
                spawn-=dt;if(spawn<=0){const r=18+Math.random()*9;enemies.push({x:30+Math.random()*(W-60),y:-30,r,hp:r>25?2:1,speed:1.3+Math.random()+score/900});spawn=Math.max(22,55-score/35)+Math.random()*22}
                enemies.forEach(e=>{e.y+=e.speed*dt;ctx.save();ctx.translate(e.x,e.y);ctx.fillStyle='#ff547e';ctx.shadowColor='#ff315e';ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(-e.r,-e.r*.45);ctx.lineTo(-e.r*.45,-e.r);ctx.lineTo(0,-e.r*.55);ctx.lineTo(e.r*.45,-e.r);ctx.lineTo(e.r,-e.r*.45);ctx.lineTo(e.r*.65,e.r*.55);ctx.lineTo(0,e.r);ctx.lineTo(-e.r*.65,e.r*.55);ctx.closePath();ctx.fill();ctx.restore();
                    for(const b of shots)if(!b.hit&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+5){b.hit=true;e.hp--;burst(b.x,b.y,'#75f8ff');beep(220,.05,'square',.02);if(e.hp<=0){e.dead=true;score+=10;scoreText.textContent=score;burst(e.x,e.y,'#ff8299');beep(150,.16,'sawtooth',.03)}}
                    if(!e.dead&&Math.hypot(player.x-e.x,player.y-e.y)<e.r+15){e.dead=true;damage()}if(e.y>H+25&&!e.dead){e.dead=true;damage()}});
                shots=shots.filter(b=>!b.hit);enemies=enemies.filter(e=>!e.dead);
                particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;ctx.globalAlpha=Math.max(0,p.life/32);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3)});ctx.globalAlpha=1;particles=particles.filter(p=>p.life>0);
                if(player.invincible>0)player.invincible-=dt;if(player.invincible<=0||Math.floor(player.invincible/4)%2===0)ship(player.x,player.y);requestAnimationFrame(frame)}
            document.querySelector('#start').addEventListener('click',()=>{beep(520,.1,'triangle');newGame()});
            window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key===' ')keys.Space=true});window.addEventListener('keyup',e=>{keys[e.key]=false;if(e.key===' ')keys.Space=false});
            let dragging=false;canvas.addEventListener('pointerdown',e=>{dragging=true;canvas.setPointerCapture(e.pointerId);keys.Space=true;movePointer(e)});canvas.addEventListener('pointermove',e=>{if(dragging)movePointer(e)});canvas.addEventListener('pointerup',()=>{dragging=false;keys.Space=false});canvas.addEventListener('pointercancel',()=>{dragging=false;keys.Space=false});
            function movePointer(e){if(!active)return;const r=canvas.getBoundingClientRect();player.x=(e.clientX-r.left)*W/r.width;player.y=(e.clientY-r.top)*H/r.height}
            function idle(){if(active)return;ctx.clearRect(0,0,W,H);stars.forEach(s=>{s.y+=s.speed*.35;if(s.y>H)s.y=0;ctx.fillStyle=`rgba(190,220,255,${.25+s.size/3})`;ctx.fillRect(s.x,s.y,s.size,s.size)});requestAnimationFrame(idle)}idle();
        })();
    </script>
</body>
</html>
