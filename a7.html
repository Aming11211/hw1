<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10111c">
    <title>霓虹彈珠俱樂部｜打磚塊</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        :root{color-scheme:dark;--ink:#f7f3e9;--muted:#a8a8b9;--pink:#ff4f9a;--cyan:#52efff;--lime:#c3ff54;--panel:#171825;--line:#ffffff20}
        *{box-sizing:border-box}
        body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#29203d 0,#171622 38%,#10111a 78%);color:var(--ink);font-family:'Noto Sans TC',sans-serif}
        body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:radial-gradient(#ffffff 0.65px,transparent .65px);background-size:19px 19px;mask-image:linear-gradient(#000,transparent 80%)}
        button{font:inherit}
        .shell{width:min(100% - 34px,1020px);margin:0 auto;padding:27px 0 24px;position:relative}
        .topline{display:flex;align-items:center;justify-content:space-between;margin:0 2px 17px}
        .brand{display:flex;gap:12px;align-items:center}
        .brand-mark{width:38px;height:38px;display:grid;place-items:center;border:1px solid #ffffff36;border-radius:11px;background:linear-gradient(145deg,#ff4f9a,#ff9a56);color:#20111b;font:900 24px 'Barlow Condensed',sans-serif;box-shadow:0 5px 20px #ff4f9a48;transform:rotate(-5deg)}
        .brand-name{font:800 17px 'Barlow Condensed','Noto Sans TC',sans-serif;letter-spacing:0;text-transform:uppercase}
        .edition{font-size:10px;font-weight:700;letter-spacing:0;color:var(--muted);margin-top:1px}
        .sound-button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:8px 11px;background:#ffffff08;color:var(--ink);font-size:12px;cursor:pointer}
        .sound-button:hover{border-color:#52efff88}
        .sound-button svg{width:16px;height:16px;color:var(--cyan)}
        .intro{display:flex;align-items:end;justify-content:space-between;margin:0 3px 15px;gap:16px}
        h1{font:900 clamp(30px,5vw,46px)/.98 'Barlow Condensed','Noto Sans TC',sans-serif;letter-spacing:0;margin:0}
        .intro p{font-size:12px;color:var(--muted);margin:7px 0 0}
        .live{display:flex;align-items:center;gap:7px;color:var(--lime);font:700 10px 'Barlow Condensed',sans-serif;letter-spacing:.12em;white-space:nowrap;padding-bottom:3px}
        .live i{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 12px var(--lime)}
        .cabinet{padding:10px;border:1px solid #ffffff1e;border-radius:11px;background:linear-gradient(145deg,#ffffff18,#ffffff04 35%,#00000036);box-shadow:0 24px 70px #0008,0 1px 0 #ffffff21 inset,0 -2px 0 #0008 inset}
        .scorebar{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;min-height:62px;padding:0 13px 7px}
        .stat{display:flex;flex-direction:column;gap:1px}
        .stat:nth-child(2){align-items:center}
        .stat:nth-child(3){align-items:flex-end}
        .stat-label{color:#9899ae;font-size:9px;font-weight:700;letter-spacing:.12em}
        .stat-value{font:800 23px/.95 'Barlow Condensed','Noto Sans TC',sans-serif;color:#fff}
        #score{color:var(--lime)}#level{color:var(--cyan)}#lives{color:#ff78ae;font-size:17px;letter-spacing:2px}
        .arena{position:relative;overflow:hidden;aspect-ratio:1.08/1;border:1px solid #52efff4d;border-radius:5px;background:#101525;touch-action:none;isolation:isolate}
        .arena:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:linear-gradient(115deg,#ffffff12,transparent 24%,transparent 74%,#ff4f9a0c);box-shadow:inset 0 0 36px #04071488}
        canvas{display:block;width:100%;height:100%;outline:none}
        .overlay{position:absolute;inset:0;z-index:2;display:grid;place-items:center;padding:20px;background:#090a16b8;backdrop-filter:blur(5px);text-align:center;transition:opacity .2s,visibility .2s}
        .overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
        .dialog{width:min(100%,390px);padding:27px 20px 22px;border:1px solid #ffffff2c;border-radius:8px;background:linear-gradient(145deg,#23253aee,#11121fee);box-shadow:0 18px 55px #0009,0 1px 0 #ffffff18 inset;animation:rise .45s both}
        @keyframes rise{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
        .eyebrow{color:var(--pink);font:800 10px 'Barlow Condensed',sans-serif;letter-spacing:.2em}
        .dialog h2{margin:7px 0 7px;color:#fff;font:900 clamp(33px,7vw,51px)/.95 'Barlow Condensed','Noto Sans TC',sans-serif;text-shadow:3px 3px 0 #ff4f9a5c}
        .dialog p{margin:0 auto 17px;max-width:290px;color:#c4c4d1;font-size:12px;line-height:1.9}
        .start-button{min-width:180px;padding:12px 24px;border:0;border-radius:4px;background:linear-gradient(100deg,#c3ff54,#52efff);color:#131523;font-size:13px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #287e87,0 8px 22px #52efff32;transition:transform .12s,filter .12s}
        .start-button:hover{filter:brightness(1.12);transform:translateY(-2px)}
        .start-button:active{transform:translateY(2px);box-shadow:0 2px 0 #287e87}
        .key-hint{margin-top:17px;color:#a7a7b7;font-size:10px;line-height:1.9}
        .key{display:inline-block;padding:1px 5px;border:1px solid #ffffff35;border-radius:3px;color:#ececf5;font:700 10px 'Barlow Condensed',sans-serif}
        .underbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 4px 1px;color:#999aab;font-size:10px}
        .underbar strong{color:#e9e8ee;font-weight:700}
        .tip{display:flex;align-items:center;gap:6px}
        .tip svg{width:14px;height:14px;color:var(--pink);flex:none}
        @media(max-width:560px){.shell{width:min(100% - 20px,500px);padding-top:16px}.topline{margin-bottom:15px}.intro{margin-bottom:12px}.intro p{font-size:10px}.live{font-size:9px}.cabinet{padding:7px;border-radius:8px}.scorebar{min-height:52px;padding:0 7px 5px}.stat-value{font-size:20px}.arena{aspect-ratio:.92/1}.underbar{align-items:flex-start;font-size:9px}.tip{max-width:58%;line-height:1.6}.dialog{padding:22px 14px 18px}}
            @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    </style>
    <script type="importmap">
        {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js"}}
    </script>
</head>
<body>
    <main class="shell">
        <header class="topline">
            <div class="brand"><div class="brand-mark" aria-hidden="true">B</div><div><div class="brand-name">Bitter Sweet Arcade</div><div class="edition">NEON TABLE No. 07</div></div></div>
            <button class="sound-button" id="soundToggle" type="button" aria-label="切換音效">
                <svg id="soundIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
                <span id="soundLabel">音效開啟</span>
            </button>
        </header>
        <section class="intro"><div><h1>霓虹彈珠俱樂部</h1><p>打碎所有色彩，讓分數一路彈高。</p></div><div class="live"><i></i> INSERT COIN</div></section>
        <section class="cabinet" aria-label="打磚塊遊戲">
            <div class="scorebar" aria-live="polite">
                <div class="stat"><span class="stat-label">SCORE</span><strong class="stat-value" id="score">000000</strong></div>
                <div class="stat"><span class="stat-label">STAGE</span><strong class="stat-value" id="level">01</strong></div>
                <div class="stat"><span class="stat-label">BALLS</span><strong class="stat-value" id="lives">● ● ●</strong></div>
            </div>
            <div class="arena" id="arena">
                <canvas id="game" aria-label="3D 霓虹打磚塊遊戲畫面"></canvas>
                <div class="overlay" id="overlay"><div class="dialog"><div class="eyebrow">THE ARCADE IS YOURS</div><h2 id="title">準備開打？</h2><p id="message">接住彈珠，擊碎全部霓虹方塊。<br>每一關都會更快、更刺激。</p><button class="start-button" id="start" type="button">開始遊戲</button><div class="key-hint"><span class="key">←</span> <span class="key">→</span> 移動球拍　・　滑鼠或手指拖曳<br>接球反彈，別讓彈珠落到底部</div></div></div>
            </div>
        </section>
        <footer class="underbar"><span>BEST <strong id="best">000000</strong></span><span class="tip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.36-6.36-1.42 1.42M7.05 16.95l-1.42 1.42m12.74 0-1.42-1.42M7.05 7.05 5.64 5.64"/><circle cx="12" cy="12" r="4"/></svg>球拍邊緣擊球可改變彈珠方向</span></footer>
    </main>
    <script type="module">
        import * as THREE from 'three';

        const canvas = document.querySelector('#game');
        const arena = document.querySelector('#arena');
        const overlay = document.querySelector('#overlay');
        const scoreText = document.querySelector('#score');
        const levelText = document.querySelector('#level');
        const livesText = document.querySelector('#lives');
        const bestText = document.querySelector('#best');
        const startButton = document.querySelector('#start');
        const soundToggle = document.querySelector('#soundToggle');
        const WIDTH = 15;
        const HEIGHT = 18;
        const HALF_W = WIDTH / 2;
        const HALF_H = HEIGHT / 2;
        const COLORS = [0xff4f9a, 0xff9c42, 0xffdf4f, 0x9bff57, 0x52efff, 0x8b78ff];
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x101525);
        const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
        camera.position.set(1.4, 4.2, 26);
        camera.lookAt(0, 0, 0);
        let renderer;
        try {
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
        } catch (error) {
            document.querySelector('#title').textContent = '無法啟動畫面';
            document.querySelector('#message').textContent = '此瀏覽器未提供 WebGL，請改用新版瀏覽器開啟。';
            startButton.hidden = true;
            throw error;
        }
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.18;

        scene.add(new THREE.HemisphereLight(0xc7f5ff, 0x39203e, 2.1));
        const keyLight = new THREE.DirectionalLight(0xffffff, 3.2);
        keyLight.position.set(-5, 9, 14);
        scene.add(keyLight);
        const pinkLight = new THREE.PointLight(0xff4f9a, 30, 17);
        pinkLight.position.set(-7, 1, 5);
        scene.add(pinkLight);
        const cyanLight = new THREE.PointLight(0x52efff, 25, 17);
        cyanLight.position.set(7, -4, 4);
        scene.add(cyanLight);

        const board = new THREE.Mesh(new THREE.BoxGeometry(WIDTH, HEIGHT, 0.65), new THREE.MeshStandardMaterial({ color: 0x151b2b, metalness: 0.34, roughness: 0.42 }));
        board.position.z = -0.72;
        scene.add(board);
        const grid = new THREE.GridHelper(18, 18, 0x34546d, 0x243348);
        grid.rotation.x = Math.PI / 2;
        grid.position.z = -0.37;
        grid.material.transparent = true;
        grid.material.opacity = 0.24;
        scene.add(grid);

        const edgeMaterial = new THREE.MeshStandardMaterial({ color: 0x52efff, emissive: 0x087d9b, emissiveIntensity: 1.4, metalness: 0.55, roughness: 0.25 });
        const railGeometry = new THREE.BoxGeometry(0.16, HEIGHT + 0.2, 0.44);
        for (const x of [-HALF_W + 0.06, HALF_W - 0.06]) {
            const rail = new THREE.Mesh(railGeometry, edgeMaterial);
            rail.position.set(x, 0, 0.02);
            scene.add(rail);
        }
        const topRail = new THREE.Mesh(new THREE.BoxGeometry(WIDTH, 0.16, 0.44), edgeMaterial);
        topRail.position.set(0, HALF_H - 0.06, 0.02);
        scene.add(topRail);

        const paddle = new THREE.Mesh(new THREE.BoxGeometry(2.7, 0.42, 0.56), new THREE.MeshStandardMaterial({ color: 0x5bfff0, emissive: 0x14baba, emissiveIntensity: 1.15, metalness: 0.28, roughness: 0.25 }));
        paddle.position.set(0, -7.65, 0.36);
        scene.add(paddle);
        const paddleCapMaterial = new THREE.MeshStandardMaterial({ color: 0xfff6bb, emissive: 0xffca55, emissiveIntensity: 1.5 });
        const paddleCapGeometry = new THREE.SphereGeometry(0.23, 16, 12);
        const paddleCaps = [-1.22, 1.22].map(x => {
            const cap = new THREE.Mesh(paddleCapGeometry, paddleCapMaterial);
            cap.scale.set(1, 0.9, 1.2);
            cap.position.set(x, -7.65, 0.46);
            scene.add(cap);
            return cap;
        });

        const ball = new THREE.Mesh(new THREE.SphereGeometry(0.24, 24, 18), new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xafffff, emissiveIntensity: 2.7, metalness: 0.12, roughness: 0.12 }));
        ball.position.set(0, -6.95, 0.55);
        scene.add(ball);
        const ballGlow = new THREE.PointLight(0x80faff, 7, 4);
        ball.add(ballGlow);

        const stars = [];
        const starGeometry = new THREE.SphereGeometry(0.025, 6, 5);
        const starMaterial = new THREE.MeshBasicMaterial({ color: 0xc7f4ff, transparent: true, opacity: 0.58 });
        for (let i = 0; i < 70; i++) {
            const star = new THREE.Mesh(starGeometry, starMaterial);
            star.position.set((Math.random() - 0.5) * (WIDTH - 1), (Math.random() - 0.5) * (HEIGHT - 1), -0.34);
            scene.add(star);
            stars.push(star);
        }

        let audio;
        let soundEnabled = true;
        let active = false;
        let score = 0;
        let lives = 3;
        let level = 1;
        let best = Number(localStorage.getItem('neon-breaker-best') || 0);
        let ballVelocity = new THREE.Vector2(4.3, 8.1);
        let bricks = [];
        let bursts = [];
        let lastFrame = 0;
        let paddleTarget = 0;
        let dragging = false;
        bestText.textContent = String(best).padStart(6, '0');

        function beep(frequency, duration = 0.09, wave = 'sine', volume = 0.055) {
            if (!soundEnabled) return;
            try {
                audio = audio || new (window.AudioContext || window.webkitAudioContext)();
                if (audio.state === 'suspended') audio.resume();
                const oscillator = audio.createOscillator();
                const gain = audio.createGain();
                oscillator.type = wave;
                oscillator.frequency.setValueAtTime(frequency, audio.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(Math.max(70, frequency * 0.58), audio.currentTime + duration);
                gain.gain.setValueAtTime(volume, audio.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + duration);
                oscillator.connect(gain);
                gain.connect(audio.destination);
                oscillator.start();
                oscillator.stop(audio.currentTime + duration);
            } catch (_) {}
        }

        function updateScore(amount) {
            score += amount;
            scoreText.textContent = String(score).padStart(6, '0');
            if (score > best) {
                best = score;
                bestText.textContent = String(best).padStart(6, '0');
                localStorage.setItem('neon-breaker-best', String(best));
            }
        }

        function showLives() {
            livesText.textContent = `${'● '.repeat(Math.max(0, lives))}${'○ '.repeat(3 - Math.max(0, lives))}`.trim();
        }

        function buildBricks() {
            for (const brick of bricks) scene.remove(brick.mesh);
            bricks = [];
            const columns = 7;
            const rows = Math.min(5 + Math.floor((level - 1) / 2), 7);
            const brickWidth = 1.82;
            const brickHeight = 0.66;
            const gap = 0.15;
            const startX = -((columns * brickWidth + (columns - 1) * gap) / 2) + brickWidth / 2;
            for (let row = 0; row < rows; row++) {
                for (let column = 0; column < columns; column++) {
                    const color = COLORS[(row + level - 1) % COLORS.length];
                    const material = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.42, metalness: 0.22, roughness: 0.29 });
                    const mesh = new THREE.Mesh(new THREE.BoxGeometry(brickWidth, brickHeight, 0.58), material);
                    mesh.position.set(startX + column * (brickWidth + gap), 7.18 - row * 0.94, 0.16);
                    scene.add(mesh);
                    const trim = new THREE.Mesh(new THREE.BoxGeometry(brickWidth * 0.72, 0.045, 0.04), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.58 }));
                    trim.position.set(0, brickHeight * 0.31, 0.31);
                    mesh.add(trim);
                    bricks.push({ mesh, halfWidth: brickWidth / 2, halfHeight: brickHeight / 2 });
                }
            }
        }

        function burstAt(position, color) {
            const geometry = new THREE.SphereGeometry(0.08, 8, 6);
            const material = new THREE.MeshBasicMaterial({ color, transparent: true });
            for (let index = 0; index < 7; index++) {
                const mesh = new THREE.Mesh(geometry, material.clone());
                mesh.position.copy(position);
                scene.add(mesh);
                bursts.push({ mesh, velocity: new THREE.Vector3((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8, Math.random() * 2), life: 0.48 });
            }
        }

        function resetBall() {
            ball.position.set(paddle.position.x, paddle.position.y + 0.7, 0.55);
            const angle = (Math.random() - 0.5) * 0.75;
            const speed = 8.8 + (level - 1) * 0.65;
            ballVelocity.set(Math.sin(angle) * speed, Math.cos(angle) * speed);
        }

        function finish(title, message) {
            active = false;
            document.querySelector('#title').textContent = title;
            document.querySelector('#message').innerHTML = message;
            startButton.textContent = '再玩一次';
            overlay.classList.remove('hidden');
        }

        function startGame() {
            score = 0;
            lives = 3;
            level = 1;
            scoreText.textContent = '000000';
            levelText.textContent = '01';
            showLives();
            buildBricks();
            paddle.position.x = 0;
            paddleTarget = 0;
            resetBall();
            bursts.forEach(item => scene.remove(item.mesh));
            bursts = [];
            overlay.classList.add('hidden');
            active = true;
            lastFrame = performance.now();
            beep(560, 0.12, 'triangle');
        }

        function resize() {
            const rect = arena.getBoundingClientRect();
            renderer.setSize(rect.width, rect.height, false);
            camera.aspect = rect.width / rect.height;
            camera.updateProjectionMatrix();
            const visibleHeight = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z;
            const visibleWidth = visibleHeight * camera.aspect;
            const scale = Math.min(rect.width / WIDTH, rect.height / HEIGHT, visibleWidth / WIDTH, visibleHeight / HEIGHT);
            scene.scale.setScalar(scale);
            camera.position.z = Math.max(22, 0.5 * HEIGHT / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
            camera.lookAt(0, 0, 0);
        }

        function mapPointer(event) {
            const rect = arena.getBoundingClientRect();
            const local = ((event.clientX - rect.left) / rect.width - 0.5) * WIDTH;
            paddleTarget = THREE.MathUtils.clamp(local, -HALF_W + 1.55, HALF_W - 1.55);
        }

        function animate(now = 0) {
            requestAnimationFrame(animate);
            const delta = Math.min((now - lastFrame) / 1000 || 0, 0.032);
            lastFrame = now;
            for (const star of stars) star.material.opacity = 0.35 + Math.sin(now * 0.001 + star.position.x) * 0.2;
            if (active) {
                paddle.position.x += (paddleTarget - paddle.position.x) * Math.min(1, delta * 15);
                paddleCaps[0].position.x = paddle.position.x - 1.22;
                paddleCaps[1].position.x = paddle.position.x + 1.22;
                ball.position.x += ballVelocity.x * delta;
                ball.position.y += ballVelocity.y * delta;
                ball.rotation.x += ballVelocity.y * delta * 0.65;
                ball.rotation.y -= ballVelocity.x * delta * 0.65;

                if (ball.position.x < -HALF_W + 0.42 || ball.position.x > HALF_W - 0.42) {
                    ball.position.x = THREE.MathUtils.clamp(ball.position.x, -HALF_W + 0.42, HALF_W - 0.42);
                    ballVelocity.x *= -1;
                    beep(300, 0.045, 'square', 0.025);
                }
                if (ball.position.y > HALF_H - 0.42) {
                    ball.position.y = HALF_H - 0.42;
                    ballVelocity.y = -Math.abs(ballVelocity.y);
                    beep(360, 0.05, 'triangle', 0.03);
                }

                const paddleY = paddle.position.y;
                if (ballVelocity.y < 0 && ball.position.y - 0.24 <= paddleY + 0.28 && ball.position.y > paddleY - 0.35 && Math.abs(ball.position.x - paddle.position.x) < 1.58) {
                    const offset = (ball.position.x - paddle.position.x) / 1.35;
                    const speed = Math.min(13.5, ballVelocity.length() + 0.18);
                    ballVelocity.set(offset * speed * 0.72, Math.sqrt(Math.max(20, speed * speed - ballVelocity.x * ballVelocity.x * 0.52)));
                    ball.position.y = paddleY + 0.48;
                    beep(650 + Math.abs(offset) * 180, 0.07, 'sine', 0.04);
                }

                for (let index = bricks.length - 1; index >= 0; index--) {
                    const brick = bricks[index];
                    const dx = ball.position.x - brick.mesh.position.x;
                    const dy = ball.position.y - brick.mesh.position.y;
                    if (Math.abs(dx) < brick.halfWidth + 0.24 && Math.abs(dy) < brick.halfHeight + 0.24) {
                        if (Math.abs(dx) / brick.halfWidth > Math.abs(dy) / brick.halfHeight) ballVelocity.x *= -1;
                        else ballVelocity.y *= -1;
                        burstAt(brick.mesh.position, brick.mesh.material.color);
                        scene.remove(brick.mesh);
                        bricks.splice(index, 1);
                        updateScore(100 * level);
                        beep(460 + (index % 5) * 90, 0.09, 'triangle', 0.045);
                        break;
                    }
                }

                if (ball.position.y < -HALF_H - 0.2) {
                    lives--;
                    showLives();
                    beep(130, 0.32, 'sawtooth', 0.065);
                    if (lives <= 0) finish('球球用完了', `本局得分 <strong style="color:#c3ff54">${String(score).padStart(6, '0')}</strong><br>再來一局，打破自己的最高分。`);
                    else resetBall();
                }

                if (bricks.length === 0 && active) {
                    level++;
                    levelText.textContent = String(level).padStart(2, '0');
                    buildBricks();
                    ballVelocity.multiplyScalar(1.06);
                    beep(880, 0.22, 'triangle', 0.055);
                }
            }
            for (let index = bursts.length - 1; index >= 0; index--) {
                const burst = bursts[index];
                burst.life -= delta;
                burst.mesh.position.addScaledVector(burst.velocity, delta);
                burst.mesh.material.opacity = Math.max(0, burst.life / 0.48);
                burst.mesh.scale.multiplyScalar(0.99);
                if (burst.life <= 0) {
                    scene.remove(burst.mesh);
                    burst.mesh.geometry.dispose();
                    burst.mesh.material.dispose();
                    bursts.splice(index, 1);
                }
            }
            renderer.render(scene, camera);
        }

        startButton.addEventListener('click', startGame);
        soundToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            document.querySelector('#soundLabel').textContent = soundEnabled ? '音效開啟' : '音效關閉';
            soundToggle.setAttribute('aria-pressed', String(soundEnabled));
            if (soundEnabled) beep(600, 0.08, 'triangle');
        });
        window.addEventListener('keydown', event => {
            if (['ArrowLeft', 'ArrowRight', ' '].includes(event.key)) event.preventDefault();
            if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') paddleTarget = Math.max(-HALF_W + 1.55, paddleTarget - 1.2);
            if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd') paddleTarget = Math.min(HALF_W - 1.55, paddleTarget + 1.2);
        });
        arena.addEventListener('pointerdown', event => { dragging = true; arena.setPointerCapture(event.pointerId); mapPointer(event); });
        arena.addEventListener('pointermove', event => { if (dragging) mapPointer(event); });
        arena.addEventListener('pointerup', () => { dragging = false; });
        arena.addEventListener('pointercancel', () => { dragging = false; });
        window.addEventListener('resize', resize);
        resize();
        buildBricks();
        showLives();
        animate();
    </script>
</body>
</html>
